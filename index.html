
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Fashion DZ | متجر الأزياء</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      color: #171717;
    }
    header {
      background: #111;
      color: white;
      padding: 25px 20px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 23px; font-weight: bold; letter-spacing: 1px; }
    .tag { color: #c6a66b; font-size: 12px; margin-top: 7px; }
    .hero {
      padding: 35px 20px;
      background: #eae5dc;
    }
    .hero h1 { font-size: 27px; margin: 0 0 10px; }
    .hero p { color: #555; line-height: 1.8; }
    .section { padding: 22px 18px; }
    .section h2 { font-size: 19px; }
    .categories {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }
    .category {
      background: white;
      border: 1px solid #ddd;
      padding: 10px 17px;
      border-radius: 25px;
      font-size: 13px;
    }
    .empty {
      background: white;
      border: 1px dashed #ccc;
      border-radius: 12px;
      text-align: center;
      padding: 35px 15px;
      color: #777;
      line-height: 1.8;
    }
    .empty span { font-size: 35px; }
    .cart {
      margin: 5px 18px 25px;
      padding: 16px;
      background: #171717;
      color: white;
      border-radius: 10px;
      text-align: center;
    }
    footer {
      padding: 20px;
      text-align: center;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div>
        <div class="logo">FASHION DZ</div>
        <div class="tag">YOUR STYLE, YOUR CHOICE</div>
      </div>
      <div>🛍️</div>
    </div>
  </header>

  <section class="hero">
    <h1>اكتشف أناقتك</h1>
    <p>مرحباً بك في Fashion DZ. وجهتك لاكتشاف الأزياء واختيار أسلوبك الخاص.</p>
  </section>

  <section class="section">
    <h2>الأقسام</h2>
    <div class="categories">
      <div class="category">الكل</div>
      <div class="category">رجالي</div>
      <div class="category">نسائي</div>
      <div class="category">إكسسوارات</div>
    </div>
  </section>

  <section class="section">
    <h2>منتجاتنا</h2>
    <div class="empty">
      <span>🛍️</span>
      <div>لا توجد منتجات حالياً</div>
      <small>سيتم عرض منتجات المتجر هنا قريباً.</small>
    </div>
  </section>

  <div class="cart">
    🛒 سلة المشتريات
    <div style="font-size:12px;margin-top:7px;color:#ccc">
      ستتوفر قريباً
    </div>
  </div>

  <footer>
    FASHION DZ © 2026
    <br>جميع الحقوق محفوظة
  </footer>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
